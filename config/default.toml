# 安全默认值：体验模式（SQLite、无 Redis、内嵌任务循环）。
# 完整模式参见 production.toml.example。
# 用法：BBBCM_CONFIG=config/default.toml ./bbbcm-web（缺省即本文件）
# 未知键会导致启动失败，不会被静默忽略。
# 优先级：安全默认 < 本文件/BBBCM_CONFIG < config/local.toml < 普通环境变量 < Secret 注入。

[server]
environment = "development"
bind = "127.0.0.1:8080"

[database]
backend = "sqlite"
schema_prefix = "bcm_"
sqlite_path = "data/bbbcm.db"
# SQLite 是单写者：该值必须为 1，否则启动被拒。
max_connections = 1
# PostgreSQL 连接串不入库：通过环境变量 BBBCM_DATABASE_POSTGRES_URL 注入。
# 开启 Redis 时连接串仅通过 BBBCM_REDIS_URL 注入，禁止写入任何 TOML。

[features]
# false 时不提供限流（DEC-024）：体验模式无注册/登录/找回速率保护，
# 仅适用于本机体验与评估，不要公开部署。
redis = false

[worker]
embedded = true

# DEC-011 未选定真实供应商；本地测试实现只能在 development/test 装配。
[adapters]
mode = "disabled"
# local_root 仅在本机覆盖文件中填写，且必须处于不被静态服务暴露的私有目录。

# 生产告警阈值未批准，不提供猜测默认值。率阈值须同时显式提供 min_samples。
[mail_alerts]
