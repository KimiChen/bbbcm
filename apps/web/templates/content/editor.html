<section class="reply-panel"><div class="reply-panel-head">{{ page.title }}</div><div class="form-panel auth-panel">
{% if let Some(preview) = editor.preview_html %}<section class="post-content" aria-label="服务端安全预览"><h2>预览</h2>{{ preview|safe }}</section>{% endif %}
<form method="post" action="{{ editor.action }}"><input type="hidden" name="csrf" value="{{ editor.csrf }}" /><input type="hidden" name="idempotency_key" value="{{ editor.idempotency_key }}" /><input type="hidden" name="version" value="{{ editor.version }}" /><input type="hidden" name="theme" value="{{ page.theme }}" /><input type="hidden" name="quote" value="{{ editor.quote }}" />
{% if editor.deleting %}<p>确认删除此内容。删除规则由当前已批准政策检查。</p>{% else %}
{% if editor.topic_fields %}<label class="grid"><span>标题</span><input name="title" value="{{ editor.title }}" required /></label><label class="grid"><span>版块</span><select name="forum_id"{% if editor.action != "/topics/new" %} disabled{% endif %}>{% for forum in editor.forum_choices %}<option value="{{ forum.href }}"{% if forum.href == editor.forum_id %} selected{% endif %}>{{ forum.label }}</option>{% endfor %}</select></label><label class="grid"><span>标签（以逗号分隔标签名称）</span><input name="tags" value="{{ editor.tag_ids }}" /></label><label class="grid"><span>访客可见性</span><select name="visibility"><option value="public"{% if editor.visibility == "public" %} selected{% endif %}>公开</option><option value="members"{% if editor.visibility == "members" %} selected{% endif %}>仅会员</option></select></label>{% endif %}
<label class="grid"><span>正文（Markdown）</span><textarea name="body" rows="16" cols="20" required>{{ editor.body }}</textarea><small>支持标题、强调、列表、引用、表格与代码；HTML按文本显示，图片和嵌入暂未开放。</small></label>{% if !editor.quote.is_empty() %}<p>引用目标：<a href="/posts/{{ editor.quote }}">查看原文</a></p>{% endif %}<button class="btn" type="submit" name="intent" value="preview">预览</button>{% endif %}<button class="btn" type="submit" name="intent" value="submit">{{ editor.submit }}</button></form></div></section>
