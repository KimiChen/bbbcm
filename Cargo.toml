[workspace]
resolver = "2"
members = [
    "apps/web",
    "apps/bbbcm-worker",
    "apps/bbbcm-cli",
    "crates/platform",
    "crates/platform-db",
    "crates/platform-outbox",
    "crates/platform-audit",
    "crates/identity",
    "crates/content",
    "crates/media",
    "crates/interaction",
    "crates/moderation",
    "crates/support",
    "crates/trust",
    "crates/privacy",
    "crates/manage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 锁定依赖中 icu_* 等 crate 要求 1.88；声明值必须覆盖实际 MSRV，否则该声明不成立。
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
axum = "0.8"
askama = "0.16"
tower-http = { version = "0.6", features = ["fs"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
hmac = "0.12"
# AUTH-011/012 的 TOTP：sha1 供 RFC 6238 默认算法（认证器普遍只支持 SHA-1），
# chacha20poly1305 用于把共享密钥加密后落库（DEC-062）。均为 RustCrypto 同族维护。
sha1 = "0.10"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
ammonia = "4.1.4"
url = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "sqlite"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v7"] }
fs2 = "0.4"
redis = { version = "1.6.0", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
tokio-util = { version = "0.7", default-features = false }

platform = { path = "crates/platform" }
platform-db = { path = "crates/platform-db" }
platform-outbox = { path = "crates/platform-outbox" }
platform-audit = { path = "crates/platform-audit" }
identity = { path = "crates/identity" }
content = { path = "crates/content" }
media = { path = "crates/media" }
interaction = { path = "crates/interaction" }
moderation = { path = "crates/moderation" }
support = { path = "crates/support" }
trust = { path = "crates/trust" }
privacy = { path = "crates/privacy" }
manage = { path = "crates/manage" }

[profile.release]
lto = "thin"
